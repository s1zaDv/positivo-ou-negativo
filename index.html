<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Positivo ou Negativo?</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        min-height: 100vh;
        background: linear-gradient(135deg, #0f172a, #312e81);
        color: #f8fafc;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .container {
        width: 100%;
        max-width: 430px;
      }

      .card {
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 24px;
        padding: 36px 28px;
        text-align: center;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(12px);
      }

      .icone {
        width: 76px;
        height: 76px;
        margin: 0 auto 24px;
        border-radius: 22px;
        background: linear-gradient(135deg, #6366f1, #a855f7);
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 38px;
        box-shadow: 0 8px 25px rgba(99, 102, 241, 0.3);
      }

      h1 {
        font-size: 27px;
        margin-bottom: 14px;
      }

      .descricao {
        color: #c4c9df;
        font-size: 15px;
        line-height: 1.7;
        margin-bottom: 28px;
      }

      .destaque {
        background: rgba(99, 102, 241, 0.12);
        border: 1px solid rgba(129, 140, 248, 0.2);
        border-radius: 16px;
        padding: 22px 16px;
        margin-bottom: 24px;
      }

      .simbolo {
        font-size: 32px;
        font-weight: bold;
        color: #a5b4fc;
        margin-bottom: 10px;
      }

      .destaque h2 {
        font-size: 17px;
        margin-bottom: 8px;
      }

      .destaque p {
        font-size: 13px;
        line-height: 1.6;
        color: #c4c9df;
      }

      .rodape {
        color: #929bb8;
        font-size: 12px;
      }

      @media (max-width: 480px) {
        .card {
          padding: 28px 20px;
        }

        h1 {
          font-size: 24px;
        }
      }
    </style>
  </head>
  <body>
    <main class="container">
      <section class="card">
        <div class="icone">±</div>

        <h1>Positivo ou Negativo?</h1>

        <p class="descricao">
          Vamos descobrir o sinal do seu número! Prepare-se para testar sua
          lógica.
        </p>

        <div class="destaque">
          <div class="simbolo">+ / −</div>

          <h2>Análise numérica</h2>

          <p>Informe um número e descubra se ele é positivo ou negativo.</p>
        </div>

        <p class="rodape">Projeto JavaScript • Lógica de programação</p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
